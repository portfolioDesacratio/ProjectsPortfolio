<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Квадрат с закруглениями -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0a0a0f" stroke="url(#g)" stroke-width="3"/>
  <!-- D (путь) -->
  <path d="M16 14 L16 50 L30 50 Q40 50 40 38 Q40 26 30 26 L26 26" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- > уголок -->
  <path d="M44 26 L50 32 L44 38" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Курсор -->
  <rect x="53" y="29" width="2.5" height="10" rx="1" fill="#667eea">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
